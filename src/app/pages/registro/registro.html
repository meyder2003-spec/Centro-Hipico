<div class="login-wrapper">
  <div class="login-card">
    <div class="header-login">
      <h2>Centro Hípico Militar</h2>
      <p>Solicitud de Registro de Personal</p>
    </div>

    <!-- Pestañas de navegación entre Login y Registro -->
    <div class="tabs">
      <a routerLink="/login" class="tab-link">
        Iniciar Sesión
      </a>
      <button class="active">
        Solicitar Registro
      </button>
    </div>

    <!-- Alertas de error y éxito -->
    @if (mensajeError()) {
      <div class="alert alert-danger">
        ⚠️ {{ mensajeError() }}
      </div>
    }

    @if (mensajeExito()) {
      <div class="alert alert-success">
        ✅ {{ mensajeExito() }}
      </div>
    }

    <!-- Formulario de Registro -->
    <form (ngSubmit)="onRegistro()" class="form-login">
      <div class="form-group">
        <label>Grado y Nombre Completo:</label>
        <input 
          type="text" 
          [(ngModel)]="nombre" 
          name="nombre" 
          placeholder="Ej: So3 Meyder Smit Zavaleta Zavaleta" 
          required 
        />
      </div>

      <div class="form-group">
        <label>Correo Electrónico / Institucional:</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="correo@militar.pe" 
          required 
        />
      </div>

      <div class="form-group">
        <label>Crear Contraseña:</label>
        <input 
          type="password" 
          [(ngModel)]="pass" 
          name="pass" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-primary btn-block">
        Enviar Solicitud de Acceso
      </button>
    </form>

    <div class="footer-login">
      <a routerLink="/">← Volver a la página principal</a>
    </div>
  </div>
</div>
